name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate icon
        run: python make_icon.py

      - name: Build EXE with PyInstaller
        run: |
          $version = python -c "exec(open('main.py', encoding='utf-8').read().split('GITHUB_REPO_URL')[0]); print(APP_VERSION)"
          Write-Host "Version: $version"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Easy-TodoList-$version" --icon app.ico main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy-TodoList-windows
          path: dist/Easy-TodoList-*.exe
          if-no-files-found: error

      # 仅在打 tag（v*）时：从 UpdateLog.md 提取「当前版本标题 → 下一个版本标题」之间的全部内容作为 Release Notes，并附带 exe
      - name: Extract release notes from UpdateLog.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/extract_release_notes.py "${{ github.ref_name }}"

      - name: Create Release (sync release notes + attach EXE)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Easy-TodoList ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/Easy-TodoList-*.exe
          draft: false
          prerelease: false
